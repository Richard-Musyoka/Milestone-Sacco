<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B7A52" />
<title>You're offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F4F7F5; color: #0B1F3A; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0B1424; color: #E7EDF6; } .card { background: #111E33 !important; border-color: #22324d !important; } p { color: #9fb0c8 !important; } }
  .card { max-width: 400px; text-align: center; background: #fff; border: 1px solid #e3e9ef; border-radius: 24px; padding: 34px 28px; box-shadow: 0 18px 40px rgba(15,35,30,.10); }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #55637a; line-height: 1.55; margin: 0 0 22px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 22px; background: #0B7A52; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/img/app/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Your balances need a live connection so they're always up to date. Check your data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
